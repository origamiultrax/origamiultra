<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>MONA — Gallery</title>

  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="airbrush.css">
  <link rel="stylesheet" href="player.css">

  <script src="app.js" defer></script>
  <script src="player.js" defer></script>
  <script src="headlines.js" defer></script>
  <script src="gallery.js" defer></script>

  <style>
    .thumb-grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding-top: 14px;
    }
    @media (max-width: 1100px){ .thumb-grid{ grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 860px){ .thumb-grid{ grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px){ .thumb-grid{ grid-template-columns: 1fr; } }

    .thumb{
      border-radius: 14px;
      overflow:hidden;
      border:1px solid rgba(57,255,20,.16);
      background: rgba(0,0,0,.35);
      cursor:pointer;
    }
    .thumb img{
      width:100%;
      height: 220px;
      object-fit: cover;
      display:block;
      filter: contrast(1.02) saturate(1.02);
      transition: transform .18s ease;
    }
    .thumb:focus img,
    .thumb:hover img{
      transform: scale(1.02);
    }

    /* Lightbox */
    .lightbox{
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.72);
      z-index: 9999;
      padding: 18px;
    }
    .lightbox.open{ display:flex; }
    .lightbox-inner{
      max-width: min(1100px, 96vw);
      max-height: 88vh;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(57,255,20,.25);
      background: rgba(0,0,0,.55);
      position: relative;
    }
    .lightbox-inner img{
      max-width: 96vw;
      max-height: 88vh;
      display:block;
      width: auto;
      height: auto;
    }
    .lightbox-bar{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-top: 1px solid rgba(57,255,20,.18);
      font-size: 18px;
      letter-spacing: .08em;
      opacity: .95;
    }
    .lb-btn{
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(57,255,20,.25);
      color: rgba(57,255,20,.92);
      padding: 8px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .lb-btn:hover{ border-color: rgba(57,255,20,.45); }
  </style>
</head>

<body class="airbrush-wall">
  <div class="crt-noise"></div>
  <div class="tracking-bar"></div>

  <div class="globe left"></div>
  <div class="globe right"></div>

  <main class="app">
    <!-- LEFT NAV -->
    <nav class="nav">
      <a class="tab" href="music.html">MUSIC</a>
      <a class="tab" href="museum.html">MUSEUM</a>
      <a class="tab" href="visuals.html">VISUALS</a>
    </nav>

    <!-- CENTER -->
    <section class="stage">
      <section class="panel hero">
        <div class="titleRow">
          <h1 id="galleryTitle" style="font-size:clamp(34px,4.8vw,72px); letter-spacing:.18em; margin:0;">GALLERY</h1>
          <div class="byline">collection viewer</div>
        </div>
        <div class="status"><a href="museum.html" style="text-decoration:none;">← BACK TO MUSEUM</a><span class="cursor"></span></div>
      </section>

      <section class="panel" style="padding:16px;">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 4px 14px; border-bottom:1px solid rgba(57,255,20,.22);">
          <div id="galleryMeta" style="letter-spacing:.14em; text-transform:uppercase; opacity:.9;">LOADING...</div>
          <div class="tag">ARCHIVE: LIVE</div>
        </div>

        <div id="thumbGrid" class="thumb-grid"></div>
      </section>
    </section>

    <!-- RIGHT NAV -->
    <nav class="nav">
      <a class="tab" href="agenda.html">AGENDA</a>
      <a class="tab" href="shop.html">SHOP</a>
      <a class="tab" href="donations.html">DONATIONS</a>
      <a class="tab" href="https://li.sten.to/ORIGAMIULTRA" target="_blank" rel="noopener noreferrer">LINKS</a>
    </nav>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-inner" role="dialog" aria-modal="true" aria-label="Image viewer">
      <img id="lightboxImg" alt="">
      <div class="lightbox-bar">
        <button id="prevBtn" class="lb-btn" type="button">Prev</button>
        <div id="lbLabel" style="opacity:.9;"></div>
        <button id="nextBtn" class="lb-btn" type="button">Next</button>
        <button id="closeBtn" class="lb-btn" type="button">Close</button>
      </div>
    </div>
  </div>
</body>
</html>
