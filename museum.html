<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>MONA — Museum</title>

  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="airbrush.css">
  <link rel="stylesheet" href="player.css">

  <script src="app.js" defer></script>
  <script src="player.js" defer></script>
  <script src="headlines.js" defer></script>
</head>

<body class="airbrush-wall">
  <div class="crt-noise"></div>
  <div class="tracking-bar"></div>

  <div class="globe left"></div>
  <div class="globe right"></div>

  <main class="app">
    <!-- LEFT NAV -->
    <nav class="nav">
      <a class="tab" href="music.html">MUSIC</a>
      <a class="tab" href="museum.html">MUSEUM</a>
      <a class="tab" href="visuals.html">VISUALS</a>
    </nav>

    <!-- CENTER -->
    <section class="stage">
      <section class="panel hero">
        <div class="titleRow">
          <h1 style="font-size:clamp(46px,6vw,84px); letter-spacing:.18em; margin:0;">MUSEUM</h1>
          <div class="byline">curated archive</div>
        </div>
        <div class="status">COLLECTIONS<span class="cursor"></span></div>
      </section>

      <!-- Collections Grid -->
      <section class="panel" style="padding:16px;">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 4px 14px; border-bottom:1px solid rgba(57,255,20,.22);">
          <div style="letter-spacing:.14em; text-transform:uppercase; opacity:.9;">AVAILABLE</div>
          <div class="tag">ARCHIVE: LIVE</div>
        </div>

        <div class="museum-grid" style="display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; padding-top:14px;">
          <!-- LIMINAL COLLECTION CARD -->
          <a class="museum-card" href="liminal.html" style="display:block; text-decoration:none;">
            <div class="card" style="border-radius:16px; overflow:hidden;">
              <div style="aspect-ratio: 16 / 10; background: rgba(0,0,0,.35); border-bottom:1px solid rgba(57,255,20,.16); overflow:hidden;">
                <!-- Cover image = first uploaded -->
                <img
                  src="P1014352.JPG"
                  alt="Liminal collection cover"
                  style="width:100%; height:100%; object-fit:cover; display:block; filter: contrast(1.02) saturate(1.02);"
                  loading="lazy"
                />
              </div>

              <div style="padding:12px 12px 14px;">
                <div style="font-size:26px; letter-spacing:.12em; text-transform:uppercase;">LIMINAL</div>
                <div style="font-size:18px; letter-spacing:.10em; opacity:.78; margin-top:4px;">
                  10 photos • click to enter
                </div>
              </div>
            </div>
          </a>

          <!-- OPTIONAL placeholder for future collection -->
          <div class="card" style="border-radius:16px; padding:18px; display:flex; align-items:center; justify-content:center; min-height: 180px; opacity:.75;">
            <div style="text-align:center;">
              <div style="font-size:24px; letter-spacing:.12em; text-transform:uppercase;">MORE SOON</div>
              <div style="font-size:18px; letter-spacing:.10em; opacity:.8; margin-top:6px;">upload next batch anytime</div>
            </div>
          </div>
        </div>

        <style>
          @media (max-width: 860px){
            .museum-grid{ grid-template-columns: 1fr !important; }
          }
        </style>
      </section>
    </section>

    <!-- RIGHT NAV -->
    <nav class="nav">
      <a class="tab" href="agenda.html">AGENDA</a>
      <a class="tab" href="shop.html">SHOP</a>
      <a class="tab" href="donations.html">DONATIONS</a>
      <a class="tab" href="https://li.sten.to/ORIGAMIULTRA" target="_blank" rel="noopener noreferrer">LINKS</a>
    </nav>
  </main>
</body>
</html>
