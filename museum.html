  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .vhs-bg {

  .stars {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image:

      radial-gradient(1px 1px at 34% 78%, #fff, transparent),
      radial-gradient(1px 1px at 56% 22%, var(--cyan), transparent),
      radial-gradient(1px 1px at 78% 56%, #fff, transparent),
      radial-gradient(1px 1px at 91% 12%, var(--magenta), transparent),
      radial-gradient(1px 1px at 8% 88%, #fff, transparent),
      radial-gradient(1px 1px at 43% 11%, var(--yellow), transparent),
      radial-gradient(1px 1px at 67% 91%, #fff, transparent);

  @keyframes twinkle { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.3; } }
  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px);

<script>

document.getElementById('yr').textContent = new Date().getFullYear();
const sparkleChars = ['\u2726','\u2605','\u2727','\u2736','\u00b7'];
const sparkleColors = ['#ffd700','#ff4bd8','#00e5ff','#39ff14','#fff'];
let sparkleCooldown = 0;
document.addEventListener('mousemove', function(e) {
  if (sparkleCooldown++ % 4 !== 0) return;
  const s = document.createElement('span');
  s.className = 'sparkle';
  s.textContent = sparkleChars[Math.floor(Math.random()*sparkleChars.length)];
  s.style.color = sparkleColors[Math.floor(Math.random()*sparkleColors.length)];
  s.style.left = (e.clientX + (Math.random()*10 - 5)) + 'px';
  s.style.top = (e.clientY + (Math.random()*10 - 5)) + 'px';
  document.body.appendChild(s);
  const start = performance.now();
  const startY = e.clientY;
  function anim(t) {
    const el = t - start;
    if (el > 800) { s.remove(); return; }
    s.style.opacity = 1 - el/800;
    s.style.top = (startY + el * 0.03) + 'px';
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
});


</script>

/* OU_PROTECTION_v1 — block casual right-click/drag/save */
img {
  -webkit-user-drag: none;

}
/* Transparent shield over any image that's inside one of these containers.
   Covers the image so a right-click hits the shield (a div) instead of the <img>. */
.gallery-tile, .lb-stage, .book-page, #lbMediaWrap,
.headline-item, .logo-plate, .twc-box, .now-playing,
.flap-face, .globe-arena .globe {

.gallery-tile::after,
.book-page::after,
.flap-face::after,
.logo-plate::after,
#lbMediaWrap::after {
  content: '';

}
/* But keep highlight-layer interactive in the book reader */

.book-page::after { pointer-events: none; }
/* Tile clicks still need to work for opening the lightbox; let the parent receive */

<script>
/* OU_PROTECTION_v1 — block casual right-click + drag-save */
(function() {
  // --- Notice popup ---
  var notice = document.createElement('div');
  notice.className = 'ou-protect-notice';
  notice.innerHTML = '\u00a9 ORIGAMI ULTRA \u00b7 PLEASE DON\u2019T SAVE' +
    '<span class="small">All works copyright. Thank you for looking.</span>';
  document.body.appendChild(notice);
  var noticeTimeout = null;
  function flashNotice() {
    notice.classList.add('show');
    if (noticeTimeout) clearTimeout(noticeTimeout);
    noticeTimeout = setTimeout(function() {
      notice.classList.remove('show');
    }, 2200);
  }

  // --- Block right-click everywhere EXCEPT on real navigation links
  //     (so people can still right-click "open in new tab" on the orbit buttons,
  //     beta-panel buttons, headline links, etc.) ---
  document.addEventListener('contextmenu', function(e) {
    var t = e.target;
    // Walk up: if there's a real <a href=...> ancestor that points to a URL,
    // allow the context menu so users can open links in new tabs.
    var a = t.closest && t.closest('a[href]');
    if (a) {
      var href = a.getAttribute('href') || '';
      if (href && href[0] !== '#') {
        return; // allow context menu on real links
      }
    }
    e.preventDefault();
    flashNotice();
  }, true);

  // --- Block drag (drag image to desktop) ---
  document.addEventListener('dragstart', function(e) {
    var t = e.target;
    if (t && (t.tagName === 'IMG' || t.tagName === 'SVG' || t.tagName === 'VIDEO')) {
      e.preventDefault();
      flashNotice();
    }
  }, true);

  // --- iOS long-press save: blocked by touch-callout CSS, but also catch here ---
  document.addEventListener('touchstart', function(e) {
    var t = e.target;
    if (t && t.tagName === 'IMG') {
      // don't preventDefault on touchstart (breaks scrolling), but the CSS handles save sheet
    }
  }, { passive: true });
})();
</script>

<script>
/* OU_PLAYER_v1 — global background music player */
(function() {
  var TRACKS = [{"title": "APOLLO", "file": "apollo.mp3"}, {"title": "Boggis, Bunce and Bean", "file": "boggis-bunce-and-bean.mp3"}, {"title": "GOD BLE$$ AMERIKKA", "file": "god-ble-amerikka.mp3"}, {"title": "HEPHAESTUS", "file": "hephaestus.mp3"}, {"title": "Heat Death of a Heart", "file": "heat-death-of-a-heart.mp3"}, {"title": "Ice Mountain", "file": "ice-mountain.mp3"}, {"title": "No, I Have Never", "file": "no-i-have-never.mp3"}, {"title": "Waste-Management", "file": "waste-management.mp3"}, {"title": "Wunk", "file": "wunk.mp3"}, {"title": "Xizi", "file": "xizi.mp3"}, {"title": "ZEUS", "file": "zeus.mp3"}, {"title": "cryostasis aperture", "file": "cryostasis-aperture.mp3"}, {"title": "fear not, I am with you", "file": "fear-not-i-am-with-you.mp3"}, {"title": "heart throbbing", "file": "heart-throbbing.mp3"}, {"title": "iris", "file": "iris.mp3"}, {"title": "lapis", "file": "lapis.mp3"}, {"title": "let he who is without sin cast the first stone", "file": "let-he-who-is-without-sin-cast-the-first-stone.mp3"}, {"title": "lichenwake", "file": "lichenwake.mp3"}, {"title": "nose bleeds", "file": "nose-bleeds.mp3"}, {"title": "rootnoise", "file": "rootnoise.mp3"}, {"title": "rue synthèse", "file": "rue-synthese.mp3"}, {"title": "serenity-now", "file": "serenity-now.mp3"}, {"title": "sleep dealer", "file": "sleep-dealer.mp3"}, {"title": "sun bleed carousels", "file": "sun-bleed-carousels.mp3"}, {"title": "sunbeams", "file": "sunbeams.mp3"}, {"title": "title flight", "file": "title-flight.mp3"}, {"title": "trilobite circle", "file": "trilobite-circle.mp3"}, {"title": "weridcore-memories", "file": "weridcore-memories.mp3"}];
  var STORE_KEY = 'ou_player_state_v1';

  // ----- Persisted state -----
  function loadState() {
    try {
      var raw = sessionStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (typeof s.idx === 'number' && s.idx >= 0 && s.idx < TRACKS.length) return s;
      }
    } catch(e) {}
    return { idx: 0, t: 0, playing: false, muted: false };
  }
  function saveState() {
    try {
      sessionStorage.setItem(STORE_KEY, JSON.stringify({
        idx: state.idx,
        t: audio.currentTime || 0,
        playing: !audio.paused,
        muted: audio.muted
      }));
    } catch(e) {}
  }

  var state = loadState();

  // ----- Audio element (one per page, sound resumes via sessionStorage) -----
  var audio = new Audio();
  audio.preload = 'metadata';
  audio.volume = 0.65;
  audio.muted = state.muted;

  // Resolve audio path. Files live at /audio/<file>, and we may be at any URL on
  // GitHub Pages including subpaths. Use a relative path that works if the site
  // is served from root or a subfolder.
  function srcFor(idx) {
    return 'audio/' + TRACKS[idx].file;
  }

  function loadTrack(idx, autoplay, seekTo) {
    if (idx < 0) idx = TRACKS.length - 1;
    if (idx >= TRACKS.length) idx = 0;
    state.idx = idx;
    audio.src = srcFor(idx);
    audio.load();
    if (typeof seekTo === 'number' && seekTo > 0) {
      audio.addEventListener('loadedmetadata', function once() {
        audio.removeEventListener('loadedmetadata', once);
        try { audio.currentTime = seekTo; } catch(e) {}
      });
    }
    updateUI();
    if (autoplay) {
      var p = audio.play();
      if (p && p.catch) p.catch(function() {
        // Browsers block autoplay until first user interaction
        state.playing = false;
        updateUI();
      });
    }
    saveState();
  }

  function play() {
    var p = audio.play();
    if (p && p.catch) p.catch(function() {});
  }
  function pause() { audio.pause(); }
  function togglePlay() { audio.paused ? play() : pause(); }
  function next() { loadTrack((state.idx + 1) % TRACKS.length, true); }
  function prev() {
    // If more than 3s in, restart current; else go to previous track
    if (audio.currentTime > 3) { audio.currentTime = 0; }
    else { loadTrack((state.idx - 1 + TRACKS.length) % TRACKS.length, true); }
  }
  function toggleMute() {
    audio.muted = !audio.muted;
    saveState();
    updateUI();
  }

  // Auto-advance at end
  audio.addEventListener('ended', function() { next(); });
  audio.addEventListener('play', function() { saveState(); updateUI(); });
  audio.addEventListener('pause', function() { saveState(); updateUI(); });
  audio.addEventListener('timeupdate', function() {
    updateProgress();
    // Persist position occasionally
    if (Math.floor(audio.currentTime) % 3 === 0) saveState();
  });
  audio.addEventListener('loadedmetadata', function() { updateProgress(); });

  // Save just before page navigation
  window.addEventListener('pagehide', saveState);
  window.addEventListener('beforeunload', saveState);

  // ----- UI: full player (homepage) and mini player (everywhere else) -----
  var fullEl = document.getElementById('ouPlayerFull');
  var miniEl = null;

  function fmtTime(s) {
    if (!s || !isFinite(s)) return '0:00';
    s = Math.floor(s);
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // If no full player, build a floating mini player and attach
  if (!fullEl) {
    miniEl = document.createElement('div');
    miniEl.className = 'ou-mini-player';
    miniEl.innerHTML =
      '<div class="mp-header">' +
        '<span class="mp-label-text"></span>' +
        '<button class="mp-toggle" id="mpToggle" title="Collapse/expand"></button>' +
      '</div>' +
      '<div class="mp-body" id="mpTitle">—</div>' +
      '<div class="mp-progress" id="mpProgress"><div class="mp-progress-fill" id="mpProgressFill"></div></div>' +
      '<div class="mp-time"><span id="mpCur">0:00</span><span id="mpDur">0:00</span></div>' +
      '<div class="mp-controls">' +
        '<button class="mp-btn" id="mpPrev" title="Previous">\u23ee</button>' +
        '<button class="mp-btn mp-play" id="mpPlay" title="Play/Pause">\u25b6</button>' +
        '<button class="mp-btn" id="mpNext" title="Next">\u23ed</button>' +
        '<button class="mp-btn" id="mpMute" title="Mute">\u266a</button>' +
      '</div>';
    document.body.appendChild(miniEl);

    // Restore collapsed state if saved
    try {
      if (sessionStorage.getItem('ou_player_collapsed') === '1') {
        miniEl.classList.add('collapsed');
      }
    } catch(e) {}

    document.getElementById('mpToggle').addEventListener('click', function() {
      miniEl.classList.toggle('collapsed');
      try {
        sessionStorage.setItem('ou_player_collapsed',
          miniEl.classList.contains('collapsed') ? '1' : '0');
      } catch(e) {}
    });
    document.getElementById('mpPlay').addEventListener('click', togglePlay);
    document.getElementById('mpNext').addEventListener('click', next);
    document.getElementById('mpPrev').addEventListener('click', prev);
    document.getElementById('mpMute').addEventListener('click', toggleMute);
    document.getElementById('mpProgress').addEventListener('click', function(e) {
      if (!audio.duration) return;
      var r = this.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    });
  } else {
    // Full player wiring
    document.getElementById('npPlay').addEventListener('click', togglePlay);
    document.getElementById('npNext').addEventListener('click', next);
    document.getElementById('npPrev').addEventListener('click', prev);
    document.getElementById('npMute').addEventListener('click', toggleMute);
    document.getElementById('npProgress').addEventListener('click', function(e) {
      if (!audio.duration) return;
      var r = this.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
    });
  }

  function updateUI() {
    var title = TRACKS[state.idx].title;
    var playSym = audio.paused ? '\u25b6' : '\u2161\u2161'; // play or pause-ish
    var muteSym = audio.muted ? '\u266b\u0338' : '\u266a';

    if (fullEl) {
      document.getElementById('npTitle').textContent = title;
      document.getElementById('npPlay').textContent = playSym;
      document.getElementById('npMute').textContent = muteSym;
      document.getElementById('npMute').title = audio.muted ? 'Unmute' : 'Mute';
      document.getElementById('npCount').textContent =
        (state.idx + 1) + ' / ' + TRACKS.length;
      var eq = document.getElementById('npEq');
      if (eq) eq.style.visibility = audio.paused ? 'hidden' : 'visible';
    }
    if (miniEl) {
      document.getElementById('mpTitle').textContent = title;
      document.getElementById('mpPlay').textContent = playSym;
      document.getElementById('mpMute').textContent = muteSym;
      document.getElementById('mpMute').title = audio.muted ? 'Unmute' : 'Mute';
    }
  }
  function updateProgress() {
    var pct = 0;
    if (audio.duration > 0) pct = (audio.currentTime / audio.duration) * 100;
    if (fullEl) {
      var ff = document.getElementById('npProgressFill');
      if (ff) ff.style.width = pct + '%';
      var ct = document.getElementById('npCurTime'); if (ct) ct.textContent = fmtTime(audio.currentTime);
      var d = document.getElementById('npDuration'); if (d) d.textContent = fmtTime(audio.duration);
    }
    if (miniEl) {
      var mf = document.getElementById('mpProgressFill');
      if (mf) mf.style.width = pct + '%';
      var mc = document.getElementById('mpCur'); if (mc) mc.textContent = fmtTime(audio.currentTime);
      var md = document.getElementById('mpDur'); if (md) md.textContent = fmtTime(audio.duration);
    }
  }

  // ----- Boot: load the saved track at saved position, autoplay if was playing -----
  loadTrack(state.idx, state.playing, state.t);

  // First-visit autoplay hint: browsers block autoplay before any user gesture.
  // If we tried to autoplay and failed, attach a one-time click handler that
  // resumes playback as soon as the user clicks anywhere.
  function tryAutoplayOnFirstGesture() {
    if (audio.paused && state.playing) {
      var handler = function() {
        document.removeEventListener('click', handler, true);
        document.removeEventListener('keydown', handler, true);
        play();
      };
      document.addEventListener('click', handler, true);
      document.addEventListener('keydown', handler, true);
    }
  }
  // Wait a tick for play() promise to settle
  setTimeout(tryAutoplayOnFirstGesture, 200);

})();
</script>

  document.body.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'ou-playlist-panel';
  panel.innerHTML =
    '<div class="pl-header">' +
      '<span>\u266B YOUR PLAYLIST</span>' +
      '<button class="pl-close" id="plClose">CLOSE</button>' +
    '</div>' +
    '<div class="pl-list" id="plList"></div>' +
    '<div class="pl-now" id="plNow">\u2014</div>' +
    '<div class="pl-progress" id="plProgress"><div class="pl-progress-fill" id="plFill"></div></div>' +
    '<div class="pl-controls">' +
      '<button class="pl-btn" id="plPrev">\u23ee</button>' +
      '<button class="pl-btn pl-play" id="plPlay">\u25b6</button>' +
      '<button class="pl-btn" id="plNext">\u23ed</button>' +
      '<button class="pl-btn pl-clear" id="plClear">CLEAR</button>' +
    '</div>';
  document.body.appendChild(panel);

  btn.addEventListener('click', () => { panel.classList.toggle('open'); render(); });
  document.getElementById('plClose').addEventListener('click', () => panel.classList.remove('open'));
  document.getElementById('plPlay').addEventListener('click', togglePlay);
  document.getElementById('plPrev').addEventListener('click', prev);
  document.getElementById('plNext').addEventListener('click', next);
  document.getElementById('plClear').addEventListener('click', clear);
  document.getElementById('plProgress').addEventListener('click', function(e) {
    if (!audio.duration) return;
    const r = this.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  });

  // ----- Public API: page code calls window.OUPlaylist.add(item) -----
  window.OUPlaylist = {
    add: function(item) {
      // item = {file, title, album, slug}
      // Skip if duplicate
      const exists = state.items.some(x => x.file === item.file);
      if (exists) return false;
      state.items.push(item);
      save();
      updateBadge();
      flashFeedback('+ added to playlist');
      return true;
    },
    has: function(file) {
      return state.items.some(x => x.file === file);
    },
    remove: function(file) {
      const i = state.items.findIndex(x => x.file === file);
      if (i >= 0) {
        state.items.splice(i, 1);
        if (state.idx >= state.items.length) state.idx = Math.max(0, state.items.length - 1);
        save();
        updateBadge();
        render();
      }
    },
    open: function() { panel.classList.add('open'); render(); }
  };

  function updateBadge() {
    document.getElementById('plBadge').textContent = state.items.length;
  }
  updateBadge();

  function fmtTime(s) {
    if (!s || !isFinite(s)) return '0:00';
    s = Math.floor(s);
    const m = Math.floor(s / 60); const sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function render() {
    const list = document.getElementById('plList');
    list.innerHTML = '';
    state.items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'pl-item' + (i === state.idx ? ' active' : '');
      row.innerHTML =
        '<span class="pl-pos">' + String(i+1).padStart(2,'0') + '</span>' +
        '<div class="pl-meta">' +
          '<div class="pl-track">' + escapeHtml(it.title) + '</div>' +
          '<div class="pl-album">' + escapeHtml(it.album || '') + '</div>' +
        '</div>' +
        '<button class="pl-remove" data-i="' + i + '">\u2715</button>';
      row.addEventListener('click', (e) => {
        if (e.target.classList.contains('pl-remove')) return;
        state.idx = i;
        loadAndPlay();
      });
      const rem = row.querySelector('.pl-remove');
      rem.addEventListener('click', (e) => {
        e.stopPropagation();
        state.items.splice(i, 1);
        if (state.idx >= state.items.length) state.idx = Math.max(0, state.items.length - 1);
        save();
        updateBadge();
        render();
      });
      list.appendChild(row);
    });
    const now = state.items[state.idx];
    document.getElementById('plNow').textContent = now ? '\u266b ' + now.title : '\u2014';
    document.getElementById('plPlay').textContent = audio.paused ? '\u25b6' : '\u2161\u2161';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function pauseBackgroundMusic() {
    // The global background player exposes its audio via the sessionStorage key
    // ou_player_state_v1, but the cleanest way is: tell other audio elements to pause
    document.querySelectorAll('audio').forEach(a => {
      if (a !== audio && !a.paused) a.pause();
    });
  }

  function loadAndPlay() {
    if (!state.items.length) return;
    if (state.idx >= state.items.length) state.idx = 0;
    const it = state.items[state.idx];
    audio.src = it.file;
    audio.load();
    pauseBackgroundMusic();
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
    save();
    render();
  }
  function togglePlay() {
    if (!state.items.length) return;
    if (!audio.src || audio.src === window.location.href) { loadAndPlay(); return; }
    if (audio.paused) {
      pauseBackgroundMusic();
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
    render();
  }
  function next() {
    if (!state.items.length) return;
    state.idx = (state.idx + 1) % state.items.length;
    loadAndPlay();
  }
  function prev() {
    if (!state.items.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    state.idx = (state.idx - 1 + state.items.length) % state.items.length;
    loadAndPlay();
  }
  function clear() {
    if (!confirm('Clear your entire playlist?')) return;
    audio.pause();
    state = { items: [], idx: 0, t: 0, playing: false };
    save();
    updateBadge();
    render();
  }

  audio.addEventListener('ended', next);
  audio.addEventListener('play',  render);
  audio.addEventListener('pause', render);
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    document.getElementById('plFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
  });

  // ----- Feedback tooltip when a track is added -----
  let feedbackEl = null;
  function flashFeedback(msg) {
    if (!feedbackEl) {
      feedbackEl = document.createElement('div');
      feedbackEl.style.cssText = 'position:fixed;bottom:60px;left:14px;background:rgba(0,0,0,0.92);color:#39ff14;font-family:Silkscreen,monospace;font-size:11px;letter-spacing:2px;padding:6px 12px;border:2px outset #4a8a5a;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.3s;text-shadow:0 0 4px #39ff14;box-shadow:0 0 12px rgba(57,255,20,0.5);';
      document.body.appendChild(feedbackEl);
    }
    feedbackEl.textContent = msg;
    feedbackEl.style.opacity = '1';
    clearTimeout(feedbackEl._t);
    feedbackEl._t = setTimeout(() => { feedbackEl.style.opacity = '0'; }, 1500);
  }

  // ----- On album pages, inject "+ ADD" buttons next to each track -----
  // (only if window.__ALBUM__ exists, which is set by album-*.html pages)
  function injectAddButtons() {
    if (!window.__ALBUM__) return;
    const album = window.__ALBUM__;
    const tracks = album.tracks || [];
    const rows = document.querySelectorAll('.track');
    rows.forEach((row, i) => {
      if (row.querySelector('.pl-add-btn')) return;
      const trackData = tracks[i];
      if (!trackData) return;
      const addBtn = document.createElement('button');
      addBtn.className = 'pl-add-btn';
      const inPlaylist = window.OUPlaylist.has(trackData.file);
      addBtn.textContent = inPlaylist ? '\u2713 ADDED' : '+ ADD';
      if (inPlaylist) addBtn.classList.add('added');
      addBtn.title = 'Add to playlist';
      addBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const ok = window.OUPlaylist.add({
          file: trackData.file,
          title: trackData.title.replace(/^\s*\d{1,2}\s*[-\u2013\u2014]*\s*/, '').trim(),
          album: album.title,
          slug: album.slug,
        });
        if (ok) {
          addBtn.textContent = '\u2713 ADDED';
          addBtn.classList.add('added');
        } else {
          addBtn.textContent = '\u2713 IN PLAYLIST';
          addBtn.classList.add('added');
        }
      });
      row.appendChild(addBtn);
    });
  }

  // Run after the album page's own scripts populate the tracklist
  if (window.__ALBUM__) {
    // Wait for the track DOM to be present
    let attempts = 0;
    const tryInject = () => {
      if (document.querySelectorAll('.track').length > 0 || attempts++ > 50) {
        injectAddButtons();
      } else {
        setTimeout(tryInject, 100);
      }
    };
    tryInject();
  }
})();
</script>

</body>
</html>
