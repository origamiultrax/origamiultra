<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>::: READER :: INTERNATIONAL COLLECTION OF AMBIENT DREAMSCAPES · VOL. 0 :::</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>

  @font-face {
    font-family: 'TS Block Bold';
    src: url('TS_Block_Bold.ttf') format('truetype');
    font-weight: bold; font-style: normal; font-display: swap;
  }
  :root {
    --green: #39ff14;
    --green-soft: rgba(57, 255, 20, 0.55);
    --green-dim: rgba(57, 255, 20, 0.18);
    --amber: #ffb347;
    --magenta: #ff4bd8;
    --cyan: #00e5ff;
    --yellow: #ffd700;
    --hot-pink: #ff1493;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh; background: #000; color: #e9ffe4;
    font-family: 'VT323', 'Share Tech Mono', monospace;
    overflow-x: hidden;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .blink { animation: blink 1s steps(1) infinite; }

  .vhs-bg {
    position: fixed; inset: 0;
    background-image: url('https://cinepacks.store/cdn/shop/products/vhs_600x.gif?v=1636656783');
    background-size: cover; background-position: center;
    opacity: 0.55; z-index: 0; filter: saturate(1.15) contrast(1.05);
  }
  .stars {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 34%, #fff, transparent),
      radial-gradient(1px 1px at 34% 78%, #fff, transparent),
      radial-gradient(1px 1px at 56% 22%, var(--cyan), transparent),
      radial-gradient(1px 1px at 78% 56%, #fff, transparent),
      radial-gradient(1px 1px at 91% 12%, var(--magenta), transparent),
      radial-gradient(1px 1px at 8% 88%, #fff, transparent),
      radial-gradient(1px 1px at 43% 11%, var(--yellow), transparent),
      radial-gradient(1px 1px at 67% 91%, #fff, transparent);
    animation: twinkle 3s steps(2) infinite;
  }
  @keyframes twinkle { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.3; } }
  .scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px);
    z-index: 4; pointer-events: none; mix-blend-mode: multiply;
  }
  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,0.75) 100%);
    z-index: 2; pointer-events: none;
  }
  .plant-border {
    position: fixed; top: 0; bottom: 0; width: 170px;
    z-index: 18; pointer-events: none;
    background-image: url('plant_vine.png');
    background-repeat: repeat-y; background-size: 170px auto;
    filter: drop-shadow(0 0 12px rgba(57, 255, 20, 0.45)) drop-shadow(0 0 4px rgba(0, 0, 0, 0.6));
    opacity: 0.92;
  }
  .plant-border.left { left: 0; background-position: left top; }
  .plant-border.right { right: 0; transform: scaleX(-1); background-position: left top; }

  .top-banner {
    position: relative; z-index: 6;
    background: linear-gradient(90deg, #000, #001a00, #000);
    border-bottom: 2px solid var(--green);
    padding: 4px 0; overflow: hidden;
    box-shadow: 0 0 12px rgba(57,255,20,0.6);
  }
  .top-banner-marquee {
    display: inline-block; white-space: nowrap;
    animation: scrollLeft 45s linear infinite;
    font-family: 'VT323', monospace; font-size: 18px; letter-spacing: 2px;
  }
  @keyframes scrollLeft {
    from { transform: translateX(100vw); }
    to { transform: translateX(-100%); }
  }

  .frame {
    position: relative; z-index: 5; min-height: 100vh;
    padding: 20px 200px 60px 200px;
    display: flex; flex-direction: column;
  }

  .nav-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .nav-left, .nav-right { display: flex; gap: 8px; }
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    background: rgba(0, 0, 0, 0.85);
    border: 3px outset #4a8a5a;
    color: var(--green);
    font-family: 'Silkscreen', monospace;
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer; text-transform: uppercase;
    text-decoration: none; white-space: nowrap;
    box-shadow: 0 0 10px rgba(57, 255, 20, 0.4), inset 0 0 6px rgba(57, 255, 20, 0.15);
    transition: background 0.15s, color 0.15s, border-style 0.15s;
  }
  .nav-btn:hover {
    background: var(--green); color: #000; border-style: inset;
    box-shadow: 0 0 18px rgba(57, 255, 20, 0.9);
  }
  .nav-btn.home { border-color: #c98aff; color: var(--magenta); box-shadow: 0 0 10px rgba(255,75,216,0.4), inset 0 0 6px rgba(255,75,216,0.15); }
  .nav-btn.home:hover { background: var(--magenta); color: #000; border-color: var(--magenta); box-shadow: 0 0 18px rgba(255,75,216,0.9); }
  .nav-btn.concepts { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,0.4), inset 0 0 6px rgba(0,229,255,0.15); }
  .nav-btn.concepts:hover { background: var(--cyan); color: #000; border-color: var(--cyan); box-shadow: 0 0 18px rgba(0,229,255,0.9); }
  .nav-btn.back { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 10px rgba(255,179,71,0.4), inset 0 0 6px rgba(255,179,71,0.15); }
  .nav-btn.back:hover { background: var(--amber); color: #000; border-color: var(--amber); box-shadow: 0 0 18px rgba(255,179,71,0.9); }

  .nav-breadcrumb {
    font-family: 'VT323', monospace;
    color: var(--amber); font-size: 16px; letter-spacing: 2px;
    text-shadow: 0 0 5px rgba(255, 179, 71, 0.5);
  }
  .nav-breadcrumb a { color: var(--cyan); text-decoration: none; cursor: pointer; }
  .nav-breadcrumb a:hover { text-decoration: underline; color: #fff; }
  .nav-breadcrumb .sep { color: var(--green); margin: 0 6px; }

  .title-wrap { text-align: center; margin: 10px 0 20px; }
  .title {
    font-family: 'TS Block Bold', 'Press Start 2P', sans-serif;
    font-size: clamp(44px, 6vw, 100px);
    font-weight: bold; letter-spacing: 8px;
    color: #d4ffcf; line-height: 1;
    text-shadow:
      0 0 3px #39ff14, 0 0 10px #39ff14,
      0 0 22px rgba(57,255,20,0.85),
      0 0 42px rgba(57,255,20,0.55),
      4px 4px 0 rgba(0,0,0,0.8);
    animation: titleFlicker 5s infinite;
  }
  @keyframes titleFlicker {
    0%, 100% { opacity: 1; }
    93% { opacity: 1; }
    94% { opacity: 0.72; }
    95% { opacity: 1; }
    97% { opacity: 0.88; }
  }
  .subtitle {
    font-family: 'VT323', monospace; color: var(--green);
    font-size: 17px; letter-spacing: 4px; margin-top: 4px; opacity: 0.85;
  }

  .rainbow-hr {
    height: 3px; width: 100%;
    background: linear-gradient(90deg, #ff0000, #ff8c00, #ffd700, #39ff14, #00e5ff, #6a5acd, #ff4bd8);
    margin: 12px 0 20px;
    box-shadow: 0 0 8px rgba(255,255,255,0.5);
    border: none;
  }

  .page-hint {
    text-align: center;
    font-family: 'VT323', monospace;
    color: var(--green); font-size: 18px;
    letter-spacing: 3px; margin-bottom: 24px; opacity: 0.8;
  }

  .footer-bar {
    margin-top: 30px;
    display: flex; justify-content: space-between; align-items: center;
    color: var(--green); font-size: 11px; letter-spacing: 3px;
    opacity: 0.85; padding: 0 6px;
    font-family: 'Silkscreen', 'VT323', monospace;
  }
  .footer-bar .best-viewed { color: var(--amber); font-size: 10px; }

  .sparkle {
    position: fixed; pointer-events: none;
    z-index: 999; font-size: 12px;
    text-shadow: 0 0 4px currentColor;
    font-family: monospace;
  }

  @media (max-width: 1200px) {
    .frame { padding: 20px 150px 40px 150px; }
    .plant-border { width: 130px; background-size: 130px auto; }
  }
  @media (max-width: 950px) {
    .frame { padding: 16px 100px 30px 100px; }
    .plant-border { width: 90px; background-size: 90px auto; opacity: 0.75; }
  }
  @media (max-width: 600px) {
    .plant-border { display: none; }
    .frame { padding: 16px 12px 30px; }
    .title { font-size: 42px; letter-spacing: 4px; }
  }


  /* Reader is a full-screen takeover --- hide page-level decoration that clutters */
  body { overflow: hidden; background: #0a0a0a; }
  .plant-border { display: none !important; }
  .vhs-bg { opacity: 0.35; }
  .top-banner { display: none; }

  .reader-frame {
    position: relative; z-index: 5;
    height: 100vh;
    width: 100vw;
    padding: 8px 14px 10px;
    display: flex; flex-direction: column;
    gap: 6px;
  }

  .reader-header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap;
    flex-shrink: 0;
  }
  .reader-title {
    font-family: 'TS Block Bold', monospace;
    color: #d4ffcf; font-size: clamp(13px, 1.5vw, 20px);
    letter-spacing: 2px;
    text-shadow: 0 0 6px rgba(57,255,20,0.6), 2px 2px 0 #000;
    flex: 1 1 auto; min-width: 0;
  }

  .toolbar {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
    gap: 5px; padding: 2px 0;
    flex-shrink: 0;
  }
  .tool-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px;
    background: rgba(0, 0, 0, 0.85);
    border: 3px outset #4a8a5a;
    color: var(--green);
    font-family: 'Silkscreen', monospace;
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer; text-transform: uppercase;
    text-decoration: none; white-space: nowrap;
    box-shadow: 0 0 10px rgba(57, 255, 20, 0.4), inset 0 0 6px rgba(57, 255, 20, 0.15);
    transition: background 0.15s, color 0.15s, border-style 0.15s;
  }
  .tool-btn:hover { background: var(--green); color: #000; border-style: inset; }
  .tool-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .tool-btn.active {
    background: var(--yellow); color: #000; border-color: var(--yellow); border-style: inset;
    box-shadow: 0 0 14px var(--yellow);
  }
  .tool-btn.danger { border-color: var(--hot-pink); color: var(--hot-pink); }
  .tool-btn.danger:hover { background: var(--hot-pink); color: #fff; }

  .page-counter {
    font-family: 'Silkscreen', monospace; font-size: 11px;
    color: var(--amber); background: #000; padding: 5px 10px;
    border: 2px inset #4a8a5a; letter-spacing: 2px;
    box-shadow: inset 0 0 6px rgba(255,179,71,0.3);
    white-space: nowrap;
  }
  .page-counter .cur { color: var(--green); font-size: 13px; }

  /* --- BOOK STAGE ---
     The stage fills all remaining vertical space. The book inside it is
     sized by JS to preserve each PDF's own aspect ratio while fitting
     inside the stage. Both readers share the same stage dimensions, so
     they feel the same size on screen even though the books differ. */
  .book-stage {
    flex: 1 1 0;
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    padding: 0 64px; /* leave room for arrow buttons */
  }

  .book {
    position: relative;
    display: flex;
    flex-direction: row;
    width: 1200px;
    height: 700px;
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.85);
    background: #000;
  }
  .book-page {
    position: relative;
    flex: 1 1 50%;
    width: 50%;
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    user-select: none;
  }
  .book-page.left { box-shadow: inset -14px 0 28px -10px rgba(0,0,0,0.75); }
  .book-page.right { box-shadow: inset 14px 0 28px -10px rgba(0,0,0,0.75); }
  .book-page img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #111;
    pointer-events: none;
  }
  .book-page.blank {
    background: repeating-linear-gradient(45deg, #1a1a1a 0 14px, #222 14px 28px);
  }
  .book-page.blank img { display: none; }

  .highlight-layer {
    position: absolute; inset: 0;
    pointer-events: auto;
    cursor: crosshair;
    z-index: 3;
  }
  .highlight-layer.disabled { pointer-events: none; cursor: auto; }
  .highlight-rect {
    position: absolute;
    background: rgba(255, 215, 0, 0.38);
    mix-blend-mode: multiply;
    border: 1px solid rgba(255, 215, 0, 0.7);
    pointer-events: none;
  }

  /* Turn flap for page-flip animation */
  .turn-flap {
    position: absolute;
    top: 0; height: 100%;
    width: 50%;
    transform-style: preserve-3d;
    z-index: 5;
    pointer-events: none;
    transition: transform 0.75s cubic-bezier(0.4, 0.15, 0.3, 1);
    display: none;
  }
  .turn-flap.active { display: block; }
  .turn-flap.from-right { right: 0; transform-origin: left center; }
  .turn-flap.from-left  { left: 0;  transform-origin: right center; }
  .turn-flap.flipping.from-right { transform: rotateY(-180deg); }
  .turn-flap.flipping.from-left  { transform: rotateY(180deg); }
  .flap-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    background: #0a0a0a;
    overflow: hidden;
  }
  .flap-face img { width: 100%; height: 100%; object-fit: contain; background: #111; display: block; }
  .flap-face.back { transform: rotateY(180deg); }
  .turn-flap::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,0.45));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s;
  }
  .turn-flap.flipping::after { opacity: 1; }

  /* Arrows */
  .flip-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 52px; height: 52px;
    background: rgba(0,0,0,0.9);
    border: 3px outset var(--green);
    color: var(--green);
    font-family: 'Silkscreen', monospace;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(57,255,20,0.6);
    transition: all 0.15s;
    z-index: 20;
  }
  .flip-arrow:hover { background: var(--green); color: #000; border-style: inset; box-shadow: 0 0 24px rgba(57,255,20,0.9); }
  .flip-arrow:disabled { opacity: 0.25; cursor: not-allowed; }
  .flip-arrow.prev { left: 6px; }
  .flip-arrow.next { right: 6px; }

  @media (max-width: 900px) {
    .book-stage { padding: 0 54px; }
    .reader-title { font-size: 13px; letter-spacing: 1px; }
  }
  @media (max-width: 700px) {
    .book-stage { padding: 0 48px; }
    .flip-arrow { width: 40px; height: 40px; font-size: 16px; }
    .flip-arrow.prev { left: 3px; }
    .flip-arrow.next { right: 3px; }
    .reader-frame { padding: 6px 8px 8px; }
  }

  /* ===== READER v2 ===== */
  .book { perspective: 2400px; background: transparent; box-shadow: none; cursor: pointer; }
  .book.hl-mode { cursor: crosshair; }
  .book-page { background: #111; }
  .book-page.left { box-shadow: inset -14px 0 28px -10px rgba(0,0,0,0.75), 0 20px 50px rgba(0,0,0,0.85); }
  .book-page.right { box-shadow: inset 14px 0 28px -10px rgba(0,0,0,0.75), 0 20px 50px rgba(0,0,0,0.85); }
  .book-page.blank { background: transparent; box-shadow: none; }
  .book-page img { transition: opacity 0.25s ease; }
  .book-page img.pending { opacity: 0; }
  .book.single .book-page.left { display: none; }
  .book.single .book-page.right { flex-basis: 100%; width: 100%; box-shadow: inset 10px 0 22px -12px rgba(0,0,0,0.7), 0 20px 50px rgba(0,0,0,0.85); }
  .turn-flap { transition: none !important; will-change: transform; }
  .turn-flap.single { left: 0; right: auto; width: 100%; transform-origin: left center; }
  .turn-flap::after { display: none; }
  .flap-face { background: #111; }
  .flap-face.empty { background: transparent; }
  .flap-face.empty img { display: none; }
  .flap-face .shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .flap-face.front .shade { background: linear-gradient(to left, rgba(0,0,0,0.9), rgba(0,0,0,0.25)); }
  .flap-face.back .shade  { background: linear-gradient(to right, rgba(0,0,0,0.9), rgba(0,0,0,0.25)); }
  .turn-flap.from-left .flap-face.front .shade { background: linear-gradient(to right, rgba(0,0,0,0.9), rgba(0,0,0,0.25)); }
  .turn-flap.from-left .flap-face.back .shade  { background: linear-gradient(to left, rgba(0,0,0,0.9), rgba(0,0,0,0.25)); }
  .cast-shade { position: absolute; top: 0; height: 100%; width: 50%; pointer-events: none; opacity: 0; z-index: 4; display: none; }
  .cast-shade.right { display: block; right: 0; background: linear-gradient(to right, rgba(0,0,0,0.75), transparent 70%); }
  .cast-shade.left  { display: block; left: 0;  background: linear-gradient(to left, rgba(0,0,0,0.75), transparent 70%); }
  .cast-shade.single { display: block; left: 0; width: 100%; background: linear-gradient(to right, rgba(0,0,0,0.6), transparent 75%); }
  .book-stage { touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .tb-gap { width: 10px; }
  /* scrubber */
  .scrub-wrap { flex: 1 1 240px; display: flex; align-items: center; gap: 8px; max-width: 520px; min-width: 150px; }
  .scrub-wrap input[type=range] {
    -webkit-appearance: none; appearance: none; flex: 1; height: 8px; margin: 0; cursor: pointer; outline: none;
    background: linear-gradient(90deg, var(--green) var(--p, 0%), #001a05 var(--p, 0%));
    border: 2px inset #3a6a44; box-shadow: 0 0 8px rgba(57,255,20,0.25);
  }
  .scrub-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 18px; background: #000; border: 2px outset var(--green);
    box-shadow: 0 0 10px rgba(57,255,20,0.8); cursor: grab;
  }
  .scrub-wrap input[type=range]::-moz-range-thumb {
    width: 10px; height: 16px; background: #000; border: 2px outset var(--green); border-radius: 0;
    box-shadow: 0 0 10px rgba(57,255,20,0.8); cursor: grab;
  }
  .scrub-label { font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 1px; color: var(--amber); min-width: 58px; white-space: nowrap; }
  /* resume toast */
  .reader-toast {
    position: fixed; left: 50%; top: 96px; transform: translate(-50%, -8px); z-index: 9400; pointer-events: none;
    font-family: 'Silkscreen', monospace; font-size: 10px; letter-spacing: 1.5px; color: var(--green);
    background: rgba(0,0,0,0.92); border: 2px outset #4a8a5a; padding: 7px 12px; white-space: nowrap;
    box-shadow: 0 0 14px rgba(57,255,20,0.45); opacity: 0; transition: opacity 0.3s, transform 0.3s;
  }
  .reader-toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* zoom */
  .zoom-view { position: fixed; inset: 0; z-index: 9500; background: rgba(0,0,0,0.95); display: none; flex-direction: column; }
  .zoom-view.open { display: flex; }
  .zoom-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 2px solid var(--green); background: rgba(0,10,3,0.95);
    font-family: 'Silkscreen', monospace; font-size: 11px; letter-spacing: 2px; color: var(--green);
  }
  .zoom-scroll { flex: 1; overflow: auto; padding: 18px 12px 40px; }
  .zoom-scroll img {
    display: block; width: min(96vw, 1500px); height: auto; margin: 0 auto 18px;
    border: 2px solid #1e5a24; box-shadow: 0 0 22px rgba(57,255,20,0.25), 0 20px 50px rgba(0,0,0,0.8); background: #111;
  }
  @media (max-width: 600px) {
    .book-stage { padding: 0 26px; }
    .flip-arrow { width: 24px; height: 46px; font-size: 11px; border-width: 2px; }
    .flip-arrow.prev { left: 0; } .flip-arrow.next { right: 0; }
    .tb-secondary { display: none !important; }
    .scrub-wrap { order: 3; flex-basis: 100%; max-width: none; }
    .reader-toast { top: 120px; white-space: normal; text-align: center; width: 88vw; }
  }
</style>
</head>
<body>

<div class="vhs-bg"></div>
<div class="stars"></div>
<div class="vignette"></div>
<div class="plant-border left"></div>
<div class="plant-border right"></div>
<div class="scanlines"></div>

<div class="top-banner">
  <div class="top-banner-marquee">
    <span style="color:var(--yellow)">★</span>
    <span style="color:var(--green)">BOOKS ARCHIVE</span> <span style="color:var(--magenta)">✦</span>
    <span style="color:var(--cyan)">CLICK A BOOK TO READ</span> <span style="color:var(--yellow)">✦</span>
    <span style="color:var(--hot-pink)">ALL WORKS © ORIGAMI ULTRA</span> <span style="color:var(--green)">✦</span>
    <span style="color:var(--amber)">DO NOT REDISTRIBUTE</span> <span style="color:var(--magenta)">✦</span>
  </div>
</div>


<div class="reader-frame">

<script>

// (removed: no 'yr' element on reader pages)
const sparkleChars = ['\u2726','\u2605','\u2727','\u2736','\u00b7'];
const sparkleColors = ['#ffd700','#ff4bd8','#00e5ff','#39ff14','#fff'];
let sparkleCooldown = 0;
document.addEventListener('mousemove', function(e) {
  if (sparkleCooldown++ % 4 !== 0) return;
  const s = document.createElement('span');
  s.className = 'sparkle';
  s.textContent = sparkleChars[Math.floor(Math.random()*sparkleChars.length)];
  s.style.color = sparkleColors[Math.floor(Math.random()*sparkleColors.length)];
  s.style.left = (e.clientX + (Math.random()*10 - 5)) + 'px';
  s.style.top = (e.clientY + (Math.random()*10 - 5)) + 'px';
  document.body.appendChild(s);
  const start = performance.now();
  const startY = e.clientY;
  function anim(t) {
    const el = t - start;
    if (el > 800) { s.remove(); return; }
    s.style.opacity = 1 - el/800;
    s.style.top = (startY + el * 0.03) + 'px';
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
});


/* ==========================================================
   BOOK READER v2 — pages load as files and are decoded ahead of time,
   3D page turn, spread / single-page modes, click · swipe · keys,
   scrubber, zoom, fullscreen, remembers your place + highlights
   ========================================================== */
const BOOK = {"id": "ambient-dreamscapes-0", "count": 50, "dir": "img/books/ambient/", "zoomDir": "img/books/ambient/zoom/", "aspect": 0.9725};
const N = BOOK.count;
const pad2 = n => String(n).padStart(2, '0');
const pageSrc = i => BOOK.dir + pad2(i + 1) + '.jpg';
const zoomSrc = i => (BOOK.zoomDir || BOOK.dir) + pad2(i + 1) + '.jpg';
const $ = id => document.getElementById(id);
const bookEl = $('book'), stage = $('bookStage');
const pageL = $('pageLeft'), pageR = $('pageRight'), imgL = $('imgLeft'), imgR = $('imgRight');
const hlL = $('hlLeft'), hlR = $('hlRight');
const flap = $('turnFlap'), flapF = $('flapFront'), flapB = $('flapBack');
const shadeF = $('shadeFront'), shadeB = $('shadeBack'), cast = $('castShade');
const scrub = $('scrub'), scrubLabel = $('scrubLabel');

/* ---------- state ---------- */
const STORE = 'ou_reader_' + BOOK.id;
let saved = {}; try { saved = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) {}
const highlights = (saved && saved.hl) || {};
let pos = Math.max(0, Math.min(N - 1, parseInt(saved && saved.pos) || 0));   // first visible page
let single = false, busy = false, highlightOn = false, drag = null;
const queue = [];
function save() { try { localStorage.setItem(STORE, JSON.stringify({ pos, hl: highlights })); } catch (e) {} }

/* ---------- spread model: cover alone on the right, back cover alone on the left ---------- */
const SLOTS = [null]; for (let i = 0; i < N; i++) SLOTS.push(i); if (SLOTS.length % 2) SLOTS.push(null);
const MAX_SPREAD = SLOTS.length / 2 - 1;
const spreadOf = p => Math.floor((p + 1) / 2);
const firstOfSpread = s => SLOTS[2 * s] != null ? SLOTS[2 * s] : SLOTS[2 * s + 1];
function viewAt(p) { if (single) return [null, p]; const s = spreadOf(p); return [SLOTS[2 * s], SLOTS[2 * s + 1]]; }
function view() { return viewAt(pos); }
function stepPos(dir) {
  if (single) { const p = pos + dir; return (p < 0 || p >= N) ? null : p; }
  const s = spreadOf(pos) + dir; return (s < 0 || s > MAX_SPREAD) ? null : firstOfSpread(s);
}
function labelFor(v) { const a = v.filter(x => x != null).map(x => x + 1); return a.length ? a.join('–') : '–'; }

/* ---------- image loading: fetch + decode ahead so turns never show a blank ---------- */
const cache = {};
function load(i, srcFn) {
  srcFn = srcFn || pageSrc;
  if (i == null || i < 0 || i >= N) return Promise.resolve();
  const u = srcFn(i);
  if (!cache[u]) {
    const im = new Image(); im.decoding = 'async'; im.src = u;
    cache[u] = { im, ready: (im.decode ? im.decode() : new Promise(r => { im.onload = im.onerror = r; })).catch(() => {}) };
  }
  return cache[u].ready;
}
function ready(list) { return Promise.race([Promise.all(list.map(i => load(i))), new Promise(r => setTimeout(r, 1500))]); }
function preload() { for (let d = -3; d <= 6; d++) load(pos + d); }
function painted() {   // resolves once both visible page images are decoded and on screen
  const imgs = [imgL, imgR].filter(i => i.getAttribute('src'));
  const dec = Promise.all(imgs.map(i => i.decode ? i.decode().catch(() => {}) : null));
  return Promise.race([dec, new Promise(r => setTimeout(r, 500))])
    .then(() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))));
}

/* ---------- sizing ---------- */
function sizeBook() {
  const cs = getComputedStyle(stage);
  const availW = Math.max(160, stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
  const availH = Math.max(160, stage.clientHeight - 4);
  const aspect = BOOK.aspect * (single ? 1 : 2);
  let w = availW, h = w / aspect;
  if (h > availH) { h = availH; w = h * aspect; }
  bookEl.style.width = Math.floor(w) + 'px'; bookEl.style.height = Math.floor(h) + 'px';
}
function applyMode() {
  const s = window.innerWidth < 760 || window.innerWidth < window.innerHeight * 0.95;
  if (s !== single) { single = s; bookEl.classList.toggle('single', s); }
  sizeBook(); render();
}

/* ---------- rendering ---------- */
function setPage(el, img, hl, i) {
  if (i == null) {
    el.classList.add('blank'); img.removeAttribute('src'); hl.innerHTML = ''; hl.dataset.pageIdx = ''; return;
  }
  el.classList.remove('blank');
  const u = pageSrc(i);
  if (img.getAttribute('src') !== u) {
    const c = cache[u];
    if (!(c && c.im.complete && c.im.naturalWidth)) { img.classList.add('pending'); img.onload = () => img.classList.remove('pending'); }
    else img.classList.remove('pending');
    img.src = u;
  }
  hl.dataset.pageIdx = i; renderHighlights(hl, i);
}
function render() {
  const [l, r] = view();
  setPage(pageL, imgL, hlL, l); setPage(pageR, imgR, hlR, r);
  $('pageCur').textContent = labelFor([l, r]);
  $('btnPrev').disabled = stepPos(-1) == null;
  $('btnNext').disabled = stepPos(1) == null;
  scrub.max = single ? N - 1 : MAX_SPREAD;
  scrub.value = single ? pos : spreadOf(pos);
  paintScrub(); preload(); save();
}
function paintScrub() {
  const max = +scrub.max || 1, v = +scrub.value;
  scrub.style.setProperty('--p', (v / max * 100) + '%');
  scrubLabel.textContent = 'P. ' + labelFor(single ? [v] : [SLOTS[2 * v], SLOTS[2 * v + 1]]);
}

/* ---------- the page turn ---------- */
const EASE = 'cubic-bezier(.45,.05,.25,1)';
function go(dir) {
  if (busy) { if (queue.length < 3) queue.push(dir); return; }
  const target = stepPos(dir); if (target == null) { queue.length = 0; return; }
  busy = true;
  const cur = view(), nxt = viewAt(target);
  let front, back;
  if (single) { front = dir > 0 ? cur[1] : nxt[1]; back = null; }
  else if (dir > 0) { front = cur[1]; back = nxt[0]; }
  else { front = cur[0]; back = nxt[1]; }
  ready([front, back, nxt[0], nxt[1]]).then(() => turn(dir, target, nxt, front, back));
}
function turn(dir, target, nxt, front, back) {
  const dur = queue.length ? 340 : 640;
  flapF.src = front != null ? pageSrc(front) : ''; flapF.parentNode.classList.toggle('empty', front == null);
  flapB.src = back != null ? pageSrc(back) : '';   flapB.parentNode.classList.toggle('empty', back == null);
  let from = 0, to;
  if (single) {
    flap.className = 'turn-flap active single';
    if (dir > 0) { setPage(pageR, imgR, hlR, nxt[1]); to = -180; } else { from = -180; to = 0; }
  } else if (dir > 0) { flap.className = 'turn-flap active from-right'; setPage(pageR, imgR, hlR, nxt[1]); to = -180; }
  else { flap.className = 'turn-flap active from-left'; setPage(pageL, imgL, hlL, nxt[0]); to = 180; }
  const leaving = !(single && dir < 0);          // is the front face turning away from us?
  const t = { duration: dur, easing: EASE, fill: 'forwards' };
  const a = flap.animate([{ transform: `rotateY(${from}deg)` }, { transform: `rotateY(${to}deg)` }], t);
  const s1 = shadeF.animate(leaving ? [{ opacity: 0 }, { opacity: 0.55 }] : [{ opacity: 0.55 }, { opacity: 0 }], t);
  const s2 = shadeB.animate([{ opacity: 0.55 }, { opacity: 0 }], t);
  cast.className = 'cast-shade ' + (single ? 'single' : dir > 0 ? 'right' : 'left');
  const s3 = cast.animate([{ opacity: 0 }, { opacity: 0.45, offset: 0.45 }, { opacity: 0 }], { duration: dur, easing: 'ease-in-out' });
  a.onfinish = () => {
    pos = target; render();
    painted().then(() => {                       // lift the turning page only once the page beneath is painted
      flap.className = 'turn-flap'; cast.className = 'cast-shade';
      a.cancel(); s1.cancel(); s2.cancel(); s3.cancel();
      busy = false;
      if (queue.length) go(queue.shift());
    });
  };
}
function jumpTo(target) {
  if (busy || target == null || target === pos) return;
  queue.length = 0; busy = true;
  bookEl.animate([{ opacity: 1 }, { opacity: 0.25 }], { duration: 120, fill: 'forwards' });
  ready(viewAt(target)).then(() => {
    pos = target; render();
    painted().then(() => {
      bookEl.animate([{ opacity: 0.25 }, { opacity: 1 }], { duration: 180, fill: 'forwards' }).onfinish = () => { busy = false; };
    });
  });
}
function flipNext() { go(1); }
function flipPrev() { go(-1); }
function jumpFirst() { jumpTo(0); }
function jumpLast() { jumpTo(single ? N - 1 : firstOfSpread(MAX_SPREAD)); }

/* ---------- click a page · swipe · trackpad ---------- */
let down = null;
stage.addEventListener('pointerdown', e => {
  if (highlightOn || e.button > 0 || e.target.closest('.flip-arrow')) return;
  down = { x: e.clientX, y: e.clientY };
});
stage.addEventListener('pointerup', e => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { go(dx < 0 ? 1 : -1); return; }       // swipe
  if (Math.abs(dx) < 8 && Math.abs(dy) < 8) {                                                   // click a page
    const r = bookEl.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return;
    go(e.clientX < r.left + r.width * (single ? 0.35 : 0.5) ? -1 : 1);
  }
});
stage.addEventListener('pointercancel', () => { down = null; });
let wheelAcc = 0, wheelLock = 0;
stage.addEventListener('wheel', e => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  if (Date.now() < wheelLock) return;
  wheelAcc += e.deltaX;
  if (Math.abs(wheelAcc) > 60) { go(wheelAcc > 0 ? 1 : -1); wheelAcc = 0; wheelLock = Date.now() + 450; }
}, { passive: false });
$('btnPrev').addEventListener('click', e => { e.stopPropagation(); go(-1); });
$('btnNext').addEventListener('click', e => { e.stopPropagation(); go(1); });

/* ---------- scrubber ---------- */
scrub.addEventListener('input', paintScrub);
scrub.addEventListener('change', () => { const v = +scrub.value; jumpTo(single ? v : firstOfSpread(v)); });

/* ---------- zoom (read a page up close) ---------- */
function openZoom() {
  const pages = view().filter(i => i != null); if (!pages.length) return;
  const box = $('zoomScroll'); box.innerHTML = '';
  pages.forEach(i => {
    const im = document.createElement('img'); im.alt = 'Page ' + (i + 1); im.src = pageSrc(i);
    const hi = new Image(); hi.onload = () => { im.src = hi.src; }; hi.src = zoomSrc(i);
    box.appendChild(im);
  });
  $('zoomLabel').textContent = 'PAGE ' + labelFor(view());
  box.scrollTop = 0; $('zoomView').classList.add('open');
}
function closeZoom() { $('zoomView').classList.remove('open'); }
$('zoomView').addEventListener('click', e => { if (e.target.id === 'zoomView' || e.target.id === 'zoomScroll') closeZoom(); });

/* ---------- fullscreen ---------- */
const fsBtn = $('fsBtn');
if (!document.fullscreenEnabled) fsBtn.style.display = 'none';
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}
document.addEventListener('fullscreenchange', () => {
  fsBtn.textContent = document.fullscreenElement ? '\u26F6 EXIT FULLSCREEN' : '\u26F6 FULLSCREEN';
  setTimeout(applyMode, 60);
});

/* ---------- highlighter (now saved between visits) ---------- */
function renderHighlights(hl, pageIdx) {
  hl.innerHTML = '';
  for (const r of (highlights[pageIdx] || [])) {
    const d = document.createElement('div'); d.className = 'highlight-rect';
    d.style.left = (r.x * 100) + '%'; d.style.top = (r.y * 100) + '%';
    d.style.width = (r.w * 100) + '%'; d.style.height = (r.h * 100) + '%';
    hl.appendChild(d);
  }
}
function toggleHighlight() {
  highlightOn = !highlightOn;
  const btn = $('hlToggle');
  btn.textContent = '\u270E HIGHLIGHTER: ' + (highlightOn ? 'ON' : 'OFF');
  btn.classList.toggle('active', highlightOn);
  document.querySelectorAll('.highlight-layer').forEach(el => el.classList.toggle('disabled', !highlightOn));
  bookEl.classList.toggle('hl-mode', highlightOn);
}
function clearHighlights() {
  view().forEach(i => { if (i != null) delete highlights[i]; });
  render();
}
function clearAllHighlights() { for (const k in highlights) delete highlights[k]; render(); }
function setupHighlightLayer(hl) {
  hl.addEventListener('pointerdown', e => {
    if (!highlightOn) return;
    const pageIdx = parseInt(hl.dataset.pageIdx); if (isNaN(pageIdx)) return;
    const rect = hl.getBoundingClientRect();
    const x0 = (e.clientX - rect.left) / rect.width, y0 = (e.clientY - rect.top) / rect.height;
    const d = document.createElement('div'); d.className = 'highlight-rect';
    d.style.left = (x0 * 100) + '%'; d.style.top = (y0 * 100) + '%'; d.style.width = '0%'; d.style.height = '0%';
    hl.appendChild(d); drag = { hl, pageIdx, x0, y0, rectEl: d };
    hl.setPointerCapture(e.pointerId); e.preventDefault();
  });
  hl.addEventListener('pointermove', e => {
    if (!drag || drag.hl !== hl) return;
    const rect = hl.getBoundingClientRect();
    const x1 = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const y1 = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
    const s = drag.rectEl.style;
    s.left = (Math.min(drag.x0, x1) * 100) + '%'; s.top = (Math.min(drag.y0, y1) * 100) + '%';
    s.width = (Math.abs(x1 - drag.x0) * 100) + '%'; s.height = (Math.abs(y1 - drag.y0) * 100) + '%';
  });
  hl.addEventListener('pointerup', () => {
    if (!drag || drag.hl !== hl) return;
    const s = drag.rectEl.style;
    const r = { x: parseFloat(s.left) / 100, y: parseFloat(s.top) / 100, w: parseFloat(s.width) / 100, h: parseFloat(s.height) / 100 };
    if (r.w < 0.005 || r.h < 0.005) drag.rectEl.remove();
    else { (highlights[drag.pageIdx] = highlights[drag.pageIdx] || []).push(r); save(); }
    drag = null;
  });
}
setupHighlightLayer(hlL); setupHighlightLayer(hlR);

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const zoomOpen = $('zoomView').classList.contains('open');
  if (e.key === 'Escape' && zoomOpen) { closeZoom(); return; }
  if (zoomOpen) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { go(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(-1); e.preventDefault(); }
  else if (e.key === 'Home') { jumpFirst(); e.preventDefault(); }
  else if (e.key === 'End') { jumpLast(); e.preventDefault(); }
  else if (e.key === 'h' || e.key === 'H') toggleHighlight();
  else if (e.key === 'z' || e.key === 'Z') openZoom();
  else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
});

/* ---------- init ---------- */
imgR.setAttribute('fetchpriority', 'high');
$('pageTotal').textContent = N;
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(applyMode, 80); });
applyMode();
if (pos > 0) {
  const t = $('readerToast'); t.textContent = '\u21BA RESUMED AT PAGE ' + labelFor(view()) + ' \u00B7 \u23EE FIRST TO START OVER';
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3800);
}

</script>

<script>
/* OU_PROTECTION_v1 — block casual right-click + drag-save */
(function() {
  // --- Notice popup ---
  var notice = document.createElement('div');
  notice.className = 'ou-protect-notice';
  notice.innerHTML = '\u00a9 ORIGAMI ULTRA \u00b7 PLEASE DON\u2019T SAVE' +
    '<span class="small">All works copyright. Thank you for looking.</span>';
  document.body.appendChild(notice);
  var noticeTimeout = null;
  function flashNotice() {
    notice.classList.add('show');
    if (noticeTimeout) clearTimeout(noticeTimeout);
    noticeTimeout = setTimeout(function() {
      notice.classList.remove('show');
    }, 2200);
  }

  // --- Block right-click everywhere EXCEPT on real navigation links
  //     (so people can still right-click "open in new tab" on the orbit buttons,
  //     beta-panel buttons, headline links, etc.) ---
  document.addEventListener('contextmenu', function(e) {
    var t = e.target;
    // Walk up: if there's a real <a href=...> ancestor that points to a URL,
    // allow the context menu so users can open links in new tabs.
    var a = t.closest && t.closest('a[href]');
    if (a) {
      var href = a.getAttribute('href') || '';
      if (href && href[0] !== '#') {
        return; // allow context menu on real links
      }
    }
    e.preventDefault();

<script>
/* OU_PLAYER_v1 — global background music player */
(function() {
  var TRACKS = [{"title": "APOLLO", "file": "apollo.mp3"}, {"title": "Boggis, Bunce and Bean", "file": "boggis-bunce-and-bean.mp3"}, {"title": "GOD BLE$$ AMERIKKA", "file": "god-ble-amerikka.mp3"}, {"title": "HEPHAESTUS", "file": "hephaestus.mp3"}, {"title": "Heat Death of a Heart", "file": "heat-death-of-a-heart.mp3"}, {"title": "Ice Mountain", "file": "ice-mountain.mp3"}, {"title": "No, I Have Never", "file": "no-i-have-never.mp3"}, {"title": "Waste-Management", "file": "waste-management.mp3"}, {"title": "Wunk", "file": "wunk.mp3"}, {"title": "Xizi", "file": "xizi.mp3"}, {"title": "ZEUS", "file": "zeus.mp3"}, {"title": "cryostasis aperture", "file": "cryostasis-aperture.mp3"}, {"title": "fear not, I am with you", "file": "fear-not-i-am-with-you.mp3"}, {"title": "heart throbbing", "file": "heart-throbbing.mp3"}, {"title": "iris", "file": "iris.mp3"}, {"title": "lapis", "file": "lapis.mp3"}, {"title": "let he who is without sin cast the first stone", "file": "let-he-who-is-without-sin-cast-the-first-stone.mp3"}, {"title": "lichenwake", "file": "lichenwake.mp3"}, {"title": "nose bleeds", "file": "nose-bleeds.mp3"}, {"title": "rootnoise", "file": "rootnoise.mp3"}, {"title": "rue synthèse", "file": "rue-synthese.mp3"}, {"title": "serenity-now", "file": "serenity-now.mp3"}, {"title": "sleep dealer", "file": "sleep-dealer.mp3"}, {"title": "sun bleed carousels", "file": "sun-bleed-carousels.mp3"}, {"title": "sunbeams", "file": "sunbeams.mp3"}, {"title": "title flight", "file": "title-flight.mp3"}, {"title": "trilobite circle", "file": "trilobite-circle.mp3"}, {"title": "weridcore-memories", "file": "weridcore-memories.mp3"}];
  var STORE_KEY = 'ou_player_state_v1';

  // ----- Persisted state -----
  function loadState() {
    try {
      var raw = sessionStorage.getItem(STORE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (typeof s.idx === 'number' && s.idx >= 0 && s.idx < TRACKS.length) return s;
      }
    } catch(e) {}
    return { idx: 0, t: 0, playing: false, muted: false };
  }
  function saveState() {
    try {
      sessionStorage.setItem(STORE_KEY, JSON.stringify({
        idx: state.idx,
        t: audio.currentTime || 0,
        playing: !audio.paused,
        muted: audio.muted
      }));
    } catch(e) {}
  }

  var state = loadState();

  // ----- Audio element (one per page, sound resumes via sessionStorage) -----
  var audio = new Audio();
  audio.preload = 'metadata';
  audio.volume = 0.65;

  // Resolve audio path. Files live at /audio/<file>, and we may be at any URL on
  // GitHub Pages including subpaths. Use a relative path that works if the site
  // is served from root or a subfolder.
  function srcFor(idx) {
    return 'audio/' + TRACKS[idx].file;
  }

  function loadTrack(idx, autoplay, seekTo) {
    if (idx < 0) idx = TRACKS.length - 1;
    if (idx >= TRACKS.length) idx = 0;
    state.idx = idx;
    audio.src = srcFor(idx);
    audio.load();
    if (typeof seekTo === 'number' && seekTo > 0) {
      audio.addEventListener('loadedmetadata', function once() {
        audio.removeEventListener('loadedmetadata', once);
        try { audio.currentTime = seekTo; } catch(e) {}
      });
    }
    updateUI();
    if (autoplay) {
      var p = audio.play();
      if (p && p.catch) p.catch(function() {
        // Browsers block autoplay until first user interaction
        state.playing = false;
        updateUI();
      });
    }
    saveState();
  }

  function play() {
    var p = audio.play();
    if (p && p.catch) p.catch(function() {});
  }
  function pause() { audio.pause(); }
  function togglePlay() { audio.paused ? play() : pause(); }
  function next() { loadTrack((state.idx + 1) % TRACKS.length, true); }
  function prev() {
    // If more than 3s in, restart current; else go to previous track
    if (audio.currentTime > 3) { audio.currentTime = 0; }
    else { loadTrack((state.idx - 1 + TRACKS.length) % TRACKS.length, true); }
  }
  function toggleMute() {
    audio.muted = !audio.muted;
    saveState();
    updateUI();
  }

  // Auto-advance at end
  audio.addEventListener('ended', function() { next(); });
  audio.addEventListener('play', function() { saveState(); updateUI(); });
  audio.addEventListener('pause', function() { saveState(); updateUI(); });
  audio.addEventListener('timeupdate', function() {
    updateProgress();
    // Persist position occasionally
    if (Math.floor(audio.currentTime) % 3 === 0) saveState();

    s = Math.floor(s);

        '<span class="mp-label-text"></span>' +

        '<button class="mp-btn" id="mpNext" title="Next">\u23ed</button>' +
        '<button class="mp-btn" id="mpMute" title="Mute">\u266a</button>' +

    document.getElementById('mpNext').addEventListener('click', next);
    document.getElementById('mpPrev').addEventListener('click', prev);
    document.getElementById('mpMute').addEventListener('click', toggleMute);
    document.getElementById('mpProgress').addEventListener('click', function(e) {

    document.getElementById('npPlay').addEventListener('click', togglePlay);
    document.getElementById('npNext').addEventListener('click', next);
    document.getElementById('npPrev').addEventListener('click', prev);
    document.getElementById('npMute').addEventListener('click', toggleMute);
    document.getElementById('npProgress').addEventListener('click', function(e) {
      if (!audio.duration) return;
      var r = this.getBoundingClientRect();
      audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;

  }

  function updateUI() {
    var title = TRACKS[state.idx].title;
    var playSym = audio.paused ? '\u25b6' : '\u2161\u2161'; // play or pause-ish
    var muteSym = audio.muted ? '\u266b\u0338' : '\u266a';

    if (fullEl) {
      document.getElementById('npTitle').textContent = title;
      document.getElementById('npPlay').textContent = playSym;
      document.getElementById('npMute').textContent = muteSym;
      document.getElementById('npMute').title = audio.muted ? 'Unmute' : 'Mute';
      document.getElementById('npCount').textContent =
        (state.idx + 1) + ' / ' + TRACKS.length;
      var eq = document.getElementById('npEq');

    }
    if (miniEl) {
      document.getElementById('mpTitle').textContent = title;
      document.getElementById('mpPlay').textContent = playSym;
      document.getElementById('mpMute').textContent = muteSym;
      document.getElementById('mpMute').title = audio.muted ? 'Unmute' : 'Mute';
    }
  }
  function updateProgress() {
    var pct = 0;
    if (audio.duration > 0) pct = (audio.currentTime / audio.duration) * 100;
    if (fullEl) {

      if (ff) ff.style.width = pct + '%';
      var ct = document.getElementById('npCurTime'); if (ct) ct.textContent = fmtTime(audio.currentTime);
      var d = document.getElementById('npDuration'); if (d) d.textContent = fmtTime(audio.duration);

      var md = document.getElementById('mpDur'); if (md) md.textContent = fmtTime(audio.duration);

  loadTrack(state.idx, state.playing, state.t);

  function tryAutoplayOnFirstGesture() {

  setTimeout(tryAutoplayOnFirstGesture, 200);

})();

  letter-spacing: 1px;
  border-top: 1px dashed rgba(57, 255, 20, 0.25);
  margin-top: 4px;
}
.ou-playlist-panel .pl-progress {
  width: 100%;
  height: 3px;
  background: #001a05;
  border: 1px inset #3a6a44;
  margin: 3px 0;
  cursor: pointer;
}
.ou-playlist-panel .pl-progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #ff4bd8, #00e5ff);
  box-shadow: 0 0 4px #ff4bd8;
}

/* Track-row "+ add" button (album pages only) */
.track .pl-add-btn {
  background: rgba(0,0,0,0.5);
  border: 1px outset #4a8a5a;
  color: #ff4bd8;
  font-family: 'Silkscreen', monospace;
  font-size: 9px;
  padding: 1px 6px;
  cursor: pointer;
  margin-left: 8px;
  text-shadow: 0 0 3px #ff4bd8;
  letter-spacing: 1px;
  white-space: nowrap;
}
.track .pl-add-btn:hover { background: #ff4bd8; color: #000; border-style: inset; text-shadow: none; }
.track .pl-add-btn.added { background: #39ff14; color: #000; border-color: #39ff14; text-shadow: none; }
</style>

<script>
/* OU_PLAYLIST_v1 — global playlist */
(function() {
  const STORE_KEY = 'ou_playlist_v1';

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return { items: [], idx: 0, t: 0, playing: false };
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
  }

  let state = load();
  const audio = new Audio();
  audio.preload = 'metadata';
  audio.volume = 0.85;

  // ----- UI: toggle button + panel -----
  const btn = document.createElement('button');
  btn.className = 'ou-playlist-toggle';
  btn.innerHTML = '\u266B PLAYLIST <span class="pl-badge" id="plBadge">0</span>';
  btn.title = 'Open your playlist';
  document.body.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'ou-playlist-panel';
  panel.innerHTML =
    '<div class="pl-header">' +
      '<span>\u266B YOUR PLAYLIST</span>' +
      '<button class="pl-close" id="plClose">CLOSE</button>' +
    '</div>' +
    '<div class="pl-list" id="plList"></div>' +
    '<div class="pl-now" id="plNow">\u2014</div>' +
    '<div class="pl-progress" id="plProgress"><div class="pl-progress-fill" id="plFill"></div></div>' +
    '<div class="pl-controls">' +
      '<button class="pl-btn" id="plPrev">\u23ee</button>' +
      '<button class="pl-btn pl-play" id="plPlay">\u25b6</button>' +
      '<button class="pl-btn" id="plNext">\u23ed</button>' +
      '<button class="pl-btn pl-clear" id="plClear">CLEAR</button>' +
    '</div>';
  document.body.appendChild(panel);

  btn.addEventListener('click', () => { panel.classList.toggle('open'); render(); });
  document.getElementById('plClose').addEventListener('click', () => panel.classList.remove('open'));
  document.getElementById('plPlay').addEventListener('click', togglePlay);
  document.getElementById('plPrev').addEventListener('click', prev);
  document.getElementById('plNext').addEventListener('click', next);
  document.getElementById('plClear').addEventListener('click', clear);
  document.getElementById('plProgress').addEventListener('click', function(e) {
    if (!audio.duration) return;
    const r = this.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
  });

  // ----- Public API: page code calls window.OUPlaylist.add(item) -----
  window.OUPlaylist = {
    add: function(item) {
      // item = {file, title, album, slug}
      // Skip if duplicate
      const exists = state.items.some(x => x.file === item.file);
      if (exists) return false;
      state.items.push(item);
      save();
      updateBadge();
      flashFeedback('+ added to playlist');
      return true;
    },
    has: function(file) {
      return state.items.some(x => x.file === file);
    },
    remove: function(file) {
      const i = state.items.findIndex(x => x.file === file);
      if (i >= 0) {
        state.items.splice(i, 1);
        if (state.idx >= state.items.length) state.idx = Math.max(0, state.items.length - 1);
        save();
        updateBadge();
        render();
      }
    },
    open: function() { panel.classList.add('open'); render(); }
  };

  function updateBadge() {
    document.getElementById('plBadge').textContent = state.items.length;
  }
  updateBadge();

  function fmtTime(s) {
    if (!s || !isFinite(s)) return '0:00';
    s = Math.floor(s);
    const m = Math.floor(s / 60); const sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function render() {
    const list = document.getElementById('plList');
    list.innerHTML = '';
    state.items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'pl-item' + (i === state.idx ? ' active' : '');
      row.innerHTML =
        '<span class="pl-pos">' + String(i+1).padStart(2,'0') + '</span>' +
        '<div class="pl-meta">' +
          '<div class="pl-track">' + escapeHtml(it.title) + '</div>' +
          '<div class="pl-album">' + escapeHtml(it.album || '') + '</div>' +
        '</div>' +
        '<button class="pl-remove" data-i="' + i + '">\u2715</button>';
      row.addEventListener('click', (e) => {
        if (e.target.classList.contains('pl-remove')) return;
        state.idx = i;
        loadAndPlay();
      });
      const rem = row.querySelector('.pl-remove');
      rem.addEventListener('click', (e) => {
        e.stopPropagation();
        state.items.splice(i, 1);
        if (state.idx >= state.items.length) state.idx = Math.max(0, state.items.length - 1);
        save();
        updateBadge();
        render();
      });
      list.appendChild(row);
    });
    const now = state.items[state.idx];
    document.getElementById('plNow').textContent = now ? '\u266b ' + now.title : '\u2014';
    document.getElementById('plPlay').textContent = audio.paused ? '\u25b6' : '\u2161\u2161';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function pauseBackgroundMusic() {
    // The global background player exposes its audio via the sessionStorage key
    // ou_player_state_v1, but the cleanest way is: tell other audio elements to pause
    document.querySelectorAll('audio').forEach(a => {
      if (a !== audio && !a.paused) a.pause();
    });
  }

  function loadAndPlay() {
    if (!state.items.length) return;
    if (state.idx >= state.items.length) state.idx = 0;
    const it = state.items[state.idx];
    audio.src = it.file;
    audio.load();
    pauseBackgroundMusic();
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
    save();
    render();
  }
  function togglePlay() {
    if (!state.items.length) return;
    if (!audio.src || audio.src === window.location.href) { loadAndPlay(); return; }
    if (audio.paused) {
      pauseBackgroundMusic();
      audio.play().catch(() => {});
    } else {
      audio.pause();
    }
    render();
  }
  function next() {
    if (!state.items.length) return;
    state.idx = (state.idx + 1) % state.items.length;
    loadAndPlay();
  }
  function prev() {
    if (!state.items.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    state.idx = (state.idx - 1 + state.items.length) % state.items.length;
    loadAndPlay();
  }
  function clear() {
    if (!confirm('Clear your entire playlist?')) return;
    audio.pause();
    state = { items: [], idx: 0, t: 0, playing: false };
    save();
    updateBadge();
    render();
  }

  audio.addEventListener('ended', next);
  audio.addEventListener('play',  render);
  audio.addEventListener('pause', render);
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration) return;
    document.getElementById('plFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
  });

  // ----- Feedback tooltip when a track is added -----
  let feedbackEl = null;
  function flashFeedback(msg) {
    if (!feedbackEl) {
      feedbackEl = document.createElement('div');
      feedbackEl.style.cssText = 'position:fixed;bottom:60px;left:14px;background:rgba(0,0,0,0.92);color:#39ff14;font-family:Silkscreen,monospace;font-size:11px;letter-spacing:2px;padding:6px 12px;border:2px outset #4a8a5a;z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.3s;text-shadow:0 0 4px #39ff14;box-shadow:0 0 12px rgba(57,255,20,0.5);';
      document.body.appendChild(feedbackEl);
    }
    feedbackEl.textContent = msg;
    feedbackEl.style.opacity = '1';
    clearTimeout(feedbackEl._t);
    feedbackEl._t = setTimeout(() => { feedbackEl.style.opacity = '0'; }, 1500);
  }

  // ----- On album pages, inject "+ ADD" buttons next to each track -----
  // (only if window.__ALBUM__ exists, which is set by album-*.html pages)
  function injectAddButtons() {
    if (!window.__ALBUM__) return;
    const album = window.__ALBUM__;
    const tracks = album.tracks || [];
    const rows = document.querySelectorAll('.track');
    rows.forEach((row, i) => {
      if (row.querySelector('.pl-add-btn')) return;
      const trackData = tracks[i];
      if (!trackData) return;
      const addBtn = document.createElement('button');
      addBtn.className = 'pl-add-btn';
      const inPlaylist = window.OUPlaylist.has(trackData.file);
      addBtn.textContent = inPlaylist ? '\u2713 ADDED' : '+ ADD';
      if (inPlaylist) addBtn.classList.add('added');
      addBtn.title = 'Add to playlist';
      addBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const ok = window.OUPlaylist.add({
          file: trackData.file,
          title: trackData.title.replace(/^\s*\d{1,2}\s*[-\u2013\u2014]*\s*/, '').trim(),
          album: album.title,
          slug: album.slug,
        });
        if (ok) {
          addBtn.textContent = '\u2713 ADDED';
          addBtn.classList.add('added');
        } else {
          addBtn.textContent = '\u2713 IN PLAYLIST';
          addBtn.classList.add('added');
        }
      });
      row.appendChild(addBtn);
    });
  }

  // Run after the album page's own scripts populate the tracklist
  if (window.__ALBUM__) {
    // Wait for the track DOM to be present
    let attempts = 0;
    const tryInject = () => {
      if (document.querySelectorAll('.track').length > 0 || attempts++ > 50) {
        injectAddButtons();
      } else {
        setTimeout(tryInject, 100);
      }
    };
    tryInject();
  }
})();
</script>

</body>
</html>
